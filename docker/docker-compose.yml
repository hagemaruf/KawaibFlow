services:
  kawaibflow-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/kawaibflow.db
    ports:
      - "8080:8080"
    volumes:
      - kawaibflow-data:/app/data

  kawaibflow-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      Api__BaseUrl: http://kawaibflow-api:8080
    ports:
      - "8081:8081"
    depends_on:
      - kawaibflow-api

volumes:
  kawaibflow-data:
